name: projects-index
on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'fellows.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SCORE_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh accepted-projects list in docs/PROJECTS.md
        run: |
          python - <<'EOF'
          import json, re
          from pathlib import Path
          # Read the SOURCE OF TRUTH (submissions/*.json), not the bot-generated
          # INDEX.json. INDEX.json may be stale when this workflow runs alongside
          # score-on-merge, which would write a stale project into this list.
          points = json.loads(Path("points.json").read_text(encoding="utf-8"))
          aliases = {k.lower(): v for k, v in points.get("_aliases", {}).items()}
          def canon(raw):
              r = (raw or "").strip()
              if r in points:
                  return r
              low = r.lower()
              if low in aliases:
                  return aliases[low]
              if "github" in low or "project" in low:
                  return "Project"
              if "linked" in low:
                  return "Linkedin"
              if low in ("x", "twitter"):
                  return "X"
              if "blog" in low:
                  return "Blog"
              if "workshop" in low:
                  return "Workshop"
              if "purchase" in low or "kit" in low or low == "proof":
                  return "PurchaseProof"
              return None
          rows = []
          for f in sorted(Path("submissions").glob("*.json")):
              if f.name in ("INDEX.json", "TEMPLATE.json"):
                  continue
              try:
                  o = json.loads(f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if canon(str(o.get("type", ""))) != "Project":
                  continue
              rows.append((str(o.get("fellow", "")).strip(),
                           str(o.get("title", "")).strip(),
                           str(o.get("link", "")).strip()))
          rows.sort(key=lambda r: (r[0].lower(), r[1].lower()))
          lines = ["| Fellow | Project | Link |", "|---|---|---|"]
          for n, t, l in rows:
              lines.append(f"| {n} | {t} | {l} |")
          block = "\n".join(lines)
          p = Path("docs/PROJECTS.md")
          txt = p.read_text(encoding="utf-8")
          new = re.sub(r"(## 1\. Projects already accepted in this program \(\d+\)\n\n)\|.*?\n\n",
                       lambda m: m.group(1) + block + "\n\n", txt, flags=re.DOTALL)
          new = re.sub(r"## 1\. Projects already accepted in this program \(\d+\)",
                       f"## 1. Projects already accepted in this program ({len(rows)})", new)
          if new != txt:
              p.write_text(new, encoding="utf-8")
              print("PROJECTS.md updated")
          else:
              print("PROJECTS.md already current")
          EOF
      - name: Verify no project links a reverted submission
        run: |
          python - <<'EOF'
          import json, re, sys
          from pathlib import Path
          # Any Project link that belongs to a reverted/rejected submission must not
          # be advertised here. Compare against the live submissions/ folder.
          links = set()
          for f in Path("submissions").glob("*.json"):
              if f.name in ("INDEX.json", "TEMPLATE.json"):
                  continue
              try:
                  o = json.loads(f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              l = str(o.get("link", "")).strip()
              if l:
                  links.add(l)
          doc = Path("docs/PROJECTS.md").read_text(encoding="utf-8")
          bad = []
          for line in doc.splitlines():
              if not line.startswith("|") or line.startswith("|---") or "| Fellow |" in line:
                  continue
              cells = [c.strip() for c in line.strip("|").split("|")]
              if len(cells) < 3:
                  continue
              if cells[2].startswith("http") and cells[2] not in links:
                  bad.append(cells[2])
          if bad:
              print("FAIL: docs/PROJECTS.md lists links with no matching submission file:")
              for b in bad:
                  print("  -", b)
              sys.exit(1)
          print("PASS: every listed project links a live submission")
          EOF
      - name: Commit back
        if: always()
        run: |
          git config user.name "fellowship-bot"
          git config user.email "bot@vicharak.in"
          git add docs/PROJECTS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh accepted-projects list [skip ci]"
            # Retry once on race with the scoring bot (both push to main).
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push failed, retry $i"; sleep 5
            done
          else
            echo "No changes."
          fi
