name: file-guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only new files under submissions/ (admins exempt)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, subprocess, sys
          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          pr_author = os.environ["PR_AUTHOR"].lower()
          head_sha = os.environ["HEAD_SHA"]
          ADMIN = "nilangwork17"

          def gh(args):
              p = subprocess.run(["gh", "api"] + args, capture_output=True, text=True,
                                 env={**os.environ, "GH_TOKEN": os.environ["GH_TOKEN"]})
              return p

          # Admin exemption: if the newest commit on the PR branch was authored by an admin,
          # the admin has curated it - skip the strict single-file rule.
          commits_raw = gh([f"repos/{repo}/pulls/{pr}/commits"])
          if commits_raw.returncode != 0:
              print(f"ERROR: gh api failed: {commits_raw.stderr.strip()}")
              sys.exit(1)
          commits = json.loads(commits_raw.stdout or "[]")
          last_author = ""
          if commits:
              last_author = ((commits[-1].get("author") or {}).get("login") or "").lower()
          if pr_author == ADMIN or last_author == ADMIN:
              print(f"PASS: admin-curated branch (PR author @{pr_author}, last commit by @{last_author or 'unknown'}).")
              sys.exit(0)

          files_raw = gh([f"repos/{repo}/pulls/{pr}/files", "--paginate", "-q", ".[] | @json"])
          if files_raw.returncode != 0:
              print(f"ERROR: gh api failed: {files_raw.stderr.strip()}")
              sys.exit(1)
          files = [json.loads(line) for line in files_raw.stdout.splitlines() if line.strip()]
          print("Changed files:")
          for f in files:
              print(f"  {f.get('status')}: {f.get('filename')}")

          # 1. Missing .json extension -> silent zero points (robot only reads *.json)
          bad_ext = [f["filename"] for f in files
                     if f.get("status") == "added"
                     and f["filename"].startswith("submissions/")
                     and not f["filename"].endswith(".json")]
          if bad_ext:
              print("FAIL: these files have no .json extension. The scorer only reads "
                    "submissions/*.json, so they would be IGNORED and score 0 points silently.")
              for b in bad_ext:
                  print(f"  - {b}  ->  rename to {b}.json")
              sys.exit(1)

          # 2. Students cannot grandfather their own work (admin-only flag)
          for f in files:
              if (f.get("status") == "added" and f["filename"].endswith(".json")
                      and f["filename"].startswith("submissions/")):
                  cr = gh([f"repos/{repo}/contents/{f['filename']}?ref={head_sha}", "--jq", ".content"])
                  if cr.returncode == 0:
                      try:
                          obj = json.loads(base64.b64decode(cr.stdout.strip()).decode("utf-8"))
                          if obj.get("grandfathered"):
                              print(f"FAIL: {f['filename']} has 'grandfathered: true' which is admin-only. "
                                    "Students cannot self-grandfather their work.")
                              sys.exit(1)
                      except Exception:
                          pass

          # 2b. Validate JSON content so typos fail here, not silently later
          import json as _json
          for f in files:
              if f.get("status") == "added" and f["filename"].endswith(".json") and f["filename"].startswith("submissions/"):
                  cr = gh([f"repos/{repo}/contents/{f['filename']}?ref={head_sha}", "--jq", ".content"])
                  if cr.returncode == 0:
                      try:
                          obj = _json.loads(base64.b64decode(cr.stdout.strip()).decode("utf-8"))
                      except Exception as e:
                          print(f"FAIL: {f['filename']} is not valid JSON: {e}")
                          sys.exit(1)
                      # fellow must exist
                      fellow_raw = str(obj.get("fellow", "")).strip()
                      fellow_key = re.sub(r"\s+", " ", fellow_raw).lower()
                      if fellow_key not in fellows:
                          print(f"FAIL: {f['filename']} - fellow '{fellow_raw}' not found in fellows.csv. Check spelling.")
                          sys.exit(1)
                      # type must be valid
                      type_raw = str(obj.get("type", "")).strip()
                      ctype = None
                      if type_raw in points:
                          ctype = type_raw
                      else:
                          low = type_raw.lower()
                          if low in aliases:
                              ctype = aliases[low]
                          elif "github" in low or "project" in low:
                              ctype = "Project"
                          elif "linked" in low:
                              ctype = "Linkedin"
                          elif low in ("x", "twitter"):
                              ctype = "X"
                          elif "blog" in low:
                              ctype = "Blog"
                          elif "workshop" in low:
                              ctype = "Workshop"
                          elif "purchase" in low or "kit" in low or low == "proof":
                              ctype = "PurchaseProof"
                          elif "posted" in low or "final" in low or "publish" in low:
                              ctype = "PostedLink"
                      if ctype is None:
                          print(f"FAIL: {f['filename']} - unknown type '{type_raw}'.")
                          print(f"  Valid types: {', '.join(sorted(points))}")
                          sys.exit(1)
                      # link must start with http(s)://
                      link = str(obj.get("link", "")).strip()
                      if not (link.startswith("http://") or link.startswith("https://")):
                          print(f"FAIL: {f['filename']} - link must start with http(s)://")
                          sys.exit(1)
                      # date must be YYYY-MM-DD
                      date = str(obj.get("date", "")).strip()
                      if not re.match(r"^\d{4}-\d{2}-\d{2}$", date):
                          print(f"FAIL: {f['filename']} - date must be YYYY-MM-DD, got '{date}'")
                          sys.exit(1)

          # 3. Anything that is not a brand-new submissions/*.json is not allowed
          allowed = [f for f in files
                     if f.get("status") == "added"
                     and f["filename"].startswith("submissions/")
                     and f["filename"].endswith(".json")
                     and "TEMPLATE" not in os.path.basename(f["filename"])]
          if len(files) != 1 or not allowed:
              print(f"FAIL: student PRs must add exactly ONE new submissions/*.json file "
                    f"(found {len(files)} changed file(s)). One file = one PR.")
              for f in files:
                  if f not in allowed:
                      print(f"  - {f.get('status')}: {f.get('filename')}  (not allowed)")
              print("  Allowed: adding exactly one new submissions/<Name>_<Type>_<YYYY-MM-DD>.json")
              print("  Never: editing/deleting existing submissions, TEMPLATE.json, points.json,")
              print("          fellows.csv, scripts/, .github/, SCORES.md, README.md or allocations/.")
              sys.exit(1)

          print(f"PASS: single new submission file -> {allowed[0]['filename']}")
          EOF