name: file-guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only new files under submissions/ (admins exempt)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          author = os.environ["PR_AUTHOR"].lower()
          # Admins/bot may touch anything (rule changes, rescues, template restores).
          if author in ("nilangwork17",):
              print(f"PASS: author @{author} is admin - exempt.")
              sys.exit(0)
          out = subprocess.run(
              ["gh", "api", f"repos/{repo}/pulls/{pr}/files", "--paginate",
               "-q", '.[] | "\\(.status) \\(.filename)"'],
              capture_output=True, text=True, check=True)
          files = [l for l in out.stdout.splitlines() if l.strip()]
          print("Changed files:")
          for f in files:
              print(f"  {f}")
          bad = [f for f in files
                 if not (f.startswith("added submissions/")
                         and f.endswith(".json")
                         and "TEMPLATE" not in f.split(" ", 1)[1])]
          if len(files) != 1:
              print(f"FAIL: student PRs must add exactly ONE file under submissions/ (found {len(files)}). One file = one PR.")
              sys.exit(1)
          if bad:
              print("FAIL: non-admin PRs may only ADD a new submissions/*.json file. "
                    "No edits, renames, or deletes - and never touch TEMPLATE.json, "
                    "points.json, fellows.csv, scripts/, .github/, SCORES.md, README.md or allocations/.")
              sys.exit(1)
          print("PASS: single new submissions/*.json file.")
          EOF
