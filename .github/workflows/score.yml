name: score-on-merge
on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'fellows.csv'
      - 'points.json'
      - 'scripts/update_scores.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use admin PAT so bot can push scores back despite main branch protection.
          # Falls back to GITHUB_TOKEN if SCORE_PAT not set (will fail push on protected branch).
          token: ${{ secrets.SCORE_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF lib
        run: pip install reportlab
      - name: Update allocations
        run: python scripts/update_scores.py
        continue-on-error: true
      - name: Commit allocations back
        if: always()
        run: |
          git config user.name "fellowship-bot"
          git config user.email "bot@vicharak.in"
          git add allocations/ fellowship_scores.pdf SCORES.md README.md submissions/INDEX.json submissions/INDEX.md github_map.json
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "chore: update allocations + scores [skip ci]"
            git push
          else
            echo "No allocation changes."
          fi
